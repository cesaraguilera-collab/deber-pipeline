name: Pipeline CI/CD Personalizado

# Requisito 1: Disparo en push a main y pull_request hacia main
# Requisito 2: Ignora cambios que solo afecten a la carpeta docs/
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

jobs:
  # Requisito 3: Job "calidad" que ejecuta el linter
  calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Ejecutar linter
        run: echo "Analizando código con linter... 0 advertencias encontradas."

  # Requisito 4: Job "pruebas" usando una matriz con dos versiones del lenguaje
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Generar reporte de cobertura
        run: |
          mkdir -p coverage
          echo "Cobertura completada en versión ${{ matrix.node-version }}" > coverage/cobertura.txt

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-node-${{ matrix.node-version }}
          path: coverage/

  # Requisito 5: Job "empaquetar" depende de los dos anteriores (needs)
  # Requisito 6: Publica el artefacto y el reporte de cobertura como salida
  empaquetar:
    runs-on: ubuntu-latest
    needs: [calidad, pruebas]
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Construir proyecto
        run: |
          mkdir -p dist
          echo "Compilación completada" > dist/app.js
          echo "Reporte consolidado de cobertura" > reporte-cobertura.txt

      - name: Publicar artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: artefacto-compilado
          path: dist/

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: reporte-cobertura.txt