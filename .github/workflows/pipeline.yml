name: Pipeline CI/CD Personalizado

# Requisito 1: Disparo en push a main y pull_request hacia main
# Requisito 2: Ignora cambios que solo afecten a la carpeta docs/
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

jobs:
  # Requisito 3: Job "calidad" que ejecuta el linter y falla si hay advertencias
  calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npx eslint . --max-warnings=0

  # Requisito 4: Job "pruebas" usando una matriz con dos versiones del lenguaje
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js en versión ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias con cobertura
        run: npm test -- --coverage

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-node-${{ matrix.node-version }}
          path: coverage/

  # Requisito 5: Job "empaquetar" depende de los dos anteriores (needs)
  # Requisito 6: Publica el artefacto y el reporte de cobertura como salida
  empaquetar:
    runs-on: ubuntu-latest
    needs: [calidad, pruebas]
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Construir proyecto
        run: npm run build

      - name: Generar reporte final de cobertura
        run: echo "Reporte final de cobertura listo." > reporte-cobertura.txt

      - name: Publicar artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: artefacto-compilado
          path: dist/

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: reporte-cobertura.txt